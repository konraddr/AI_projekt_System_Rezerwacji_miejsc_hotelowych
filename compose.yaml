services:
    init:
        build:
            context: ./docker/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.5/app
        user: root
        volumes:
            - '.:/var/www/html'
            - 'composer-cache:/root/.composer'
        working_dir: /var/www/html
        environment:
            COMPOSER_ALLOW_SUPERUSER: 1
        entrypoint: ["/bin/bash", "-c"]
        command:
            - |
              set -e
              mkdir -p storage/framework/{sessions,views,cache/data} storage/logs bootstrap/cache
              chmod -R 777 storage bootstrap/cache
              test -f .env || cp .env.example .env
              if [ ! -f vendor/autoload.php ]; then
                composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
              fi
              if ! grep -q '^APP_KEY=base64' .env 2>/dev/null; then
                php artisan key:generate --force --no-interaction
              fi
              if [ -f storage/.docker-initialized ]; then
                php artisan migrate --force --no-interaction
              elif php artisan migrate:status --no-ansi 2>/dev/null | grep -q 'Ran'; then
                php artisan migrate --force --no-interaction
                touch storage/.docker-initialized
              else
                php artisan migrate --seed --force --no-interaction
                touch storage/.docker-initialized
              fi
        depends_on:
            pgsql:
                condition: service_healthy
        networks:
            - sail

    laravel.test:
        build:
            context: ./docker/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        depends_on:
            init:
                condition: service_completed_successfully
            pgsql:
                condition: service_healthy
        entrypoint: ["/bin/bash", "-c"]
        command:
            - |
              set -e
              if [ -n "$$WWWUSER" ]; then usermod -u $$WWWUSER sail 2>/dev/null || true; fi
              if [ ! -f public/build/manifest.json ]; then
                npm ci --no-audit --no-fund --prefer-offline
                npm run build
              fi
              exec /usr/local/bin/start-container
        networks:
            - sail

    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-password}'
            POSTGRES_DB: '${DB_DATABASE:-laravel}'
            POSTGRES_USER: '${DB_USERNAME:-sail}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE:-laravel}'
                - '-U'
                - '${DB_USERNAME:-sail}'
            interval: 3s
            timeout: 3s
            retries: 10
            start_period: 5s

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
    composer-cache:
        driver: local
